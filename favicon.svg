<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Gradient Background -->
  <defs>
    <linearGradient id="orbit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="clock-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Squircle rounded background -->
  <rect width="64" height="64" rx="16" fill="#09090b" stroke="#27272a" stroke-width="2"/>

  <!-- Orbital outer countdown ring -->
  <circle cx="32" cy="32" r="22" stroke="#27272a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="22" stroke="url(#orbit-grad)" stroke-width="3.5" stroke-dasharray="100 38" stroke-linecap="round"/>

  <!-- Center Timer hands -->
  <circle cx="32" cy="32" r="4" fill="#38bdf8"/>
  <line x1="32" y1="32" x2="32" y2="18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="43" y2="32" stroke="url(#clock-accent)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Milestone pulse dot -->
  <circle cx="47" cy="17" r="3" fill="#38bdf8"/>
</svg>
